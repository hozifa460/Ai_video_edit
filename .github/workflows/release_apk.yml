name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ai-video-edit-latest.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Auto-Build Release
          files: ai-video-edit-latest.apk
          prerelease: false
