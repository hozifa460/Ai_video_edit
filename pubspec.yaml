name: ai_video_editing
description: "High-precision silence removal from video files with perfect A/V sync."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffmpeg_kit_flutter_new: ^4.1.0
  flutter_riverpod: ^3.3.1
  file_picker: ^11.0.2
  video_player: ^2.11.1
  just_audio: ^0.10.5
  audio_waveforms: ^2.0.2
  chewie: ^1.12.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  equatable: ^2.0.7
  intl: ^0.20.2
  uuid: ^4.5.1
  google_mlkit_face_detection: ^0.13.2
  youtube_explode_dart: ^2.3.4
  gal: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
